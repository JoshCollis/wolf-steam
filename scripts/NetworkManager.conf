# Docker owns addresses, routes and resolv.conf. Adopt eth0's external
# connection for libnm clients without creating an automatic DHCP profile.
[main]
dns=none
rc-manager=unmanaged
no-auto-default=*

[keyfile]
unmanaged-devices=none

[device-container]
match-device=interface-name:eth0
managed=1

# Empty response means success requires a real HTTP 204, not a synthetic state.
[connectivity]
enabled=true
uri=http://steamconnecttest.com/204
interval=60
response=
